modelFile: "/mujoco_models/Acrobot/acrobot.xml"   # Path to the model xml file
modelName: "/acrobot"                             # Name of the model, used for saving data
timeStep: 0.01                                    # Time step for simulation
openloop_horizon: 1000
keypointMethod: "set_interval"                 # Possible values: "set_interval", "adaptive_jerk", "adaptive_accel", "iterative_error, "velocity_change"
minN: 1                                           # Minimum interval between key-points
maxN: 13                                         # Maximum interval between key-points
iterativeErrorThreshold: 0.0001                   # Threshold for iterative error method

#    Keypoint Method: velocity_change
#    min_N:
#      1 max_N: 13
#    jerk thresholds: 150 150
#    velocity change thresholds: 18.994 5.44213

# stable down pos [3.1415, 0], half up unstable pos [3.14, 3.14], full up unstable pos [0, 0]
robots:
  acrobot:
    jointNames: [shoulder, elbow]
    actuatorNames: [shoulder]
    torqueControl: true
    torqueLimits: [100]
    startPos: [3.1415, 0.3]
    goalPos: [0, 0]
    jointJerkThresholds: [150, 150]
#    magVelThresholds: [6.0, 6.0]
    magVelThresholds: [18.994, 5.44213]

residuals:
  joint_0:
    target: [0]
    weight: 0
    weight_terminal: 1
#  joint_1:
#    target: [0]
#    weight: 0
#    weight_terminal: 10
  joint_0_vel:
    target: [0]
    weight: 0
    weight_terminal: 0.1
  joint_1_vel:
    target: [0]
    weight: 0
    weight_terminal: 0.1
  joint_0_torque:
    target: [0]
    weight: 0.1
    weight_terminal: 0